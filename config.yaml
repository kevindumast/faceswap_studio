# Configuration du pipeline et de l'appli. Tous les chemins sont relatifs à la racine du repo.

# Moteur de calcul local :
#   auto : la carte graphique si elle est installée (CUDA, puis DirectML), sinon le CPU  ← recommandé
#   cpu  : toujours disponible (paquet onnxruntime)
#   dml  : carte graphique via DirectML, Windows, toutes marques (paquet onnxruntime-directml)
#   cuda : carte NVIDIA via CUDA (paquet onnxruntime-gpu[cuda,cudnn]) ; carte choisie par cuda_device_id
# Passer ce PC sur la carte graphique : scripts\activer_gpu.ps1 (retour au CPU : scripts\activer_gpu.ps1 -Cpu)
device: auto
cuda_device_id: 0
# DirectML sur un portable à deux cartes : split = le swap sur la carte la plus puissante (mémoire dédiée),
# l'analyse (détection, identité, segmentation) sur l'autre. ×3,5 plus rapide que tout sur la MX450 (2 Go saturés).
dml_placement: split
det_size: 640          # taille d'entrée du détecteur pendant le rendu (320 = plus rapide, moins précis)
det_thresh: 0.4        # confiance minimale d'un visage pendant le rendu (l'identité filtre les faux positifs)

# Recherche des personnes d'un passage (étape Visages) : plusieurs images, détection plus fine et plus tolérante.
scan:
  samples: 12          # images analysées, réparties sur tout le passage
  det_size: 960        # plus fin que le rendu : trouve les petits visages (plans larges, arrière-plan)
  det_thresh: 0.3      # accepte les visages flous, de profil ou dans l'ombre
  min_face_px: 24      # en dessous, trop petit pour un remplacement propre
  same_person: 0.4     # similarité ArcFace pour regrouper deux visages comme la même personne

paths:
  models: models
  data: data

ffmpeg: ffmpeg         # ou chemin complet vers ffmpeg.exe
ffprobe: ffprobe

models:
  detector_pack: buffalo_l
  buffalo_l_url: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
  inswapper: inswapper_128.onnx
  inswapper_urls:
    - https://huggingface.co/ezioruan/inswapper_128.onnx/resolve/main/inswapper_128.onnx
    - https://huggingface.co/datasets/Gourieff/ReActor/resolve/main/models/inswapper_128.onnx
  parser: bisenet_resnet_34.onnx          # segmentation du visage (niveau 2 et +)
  parser_urls:
    - https://huggingface.co/facefusion/models-3.0.0/resolve/main/bisenet_resnet_34.onnx

# Niveaux de transformation. sec_per_frame = estimation CPU avant la première mesure sur ta machine.
levels:
  face:
    sec_per_frame: 2.2
    sec_per_frame_gpu: 0.35     # MX450 + Iris Xe (DirectML réparti), mesuré
  face_tone:
    sec_per_frame: 2.9          # ≈ visage + 0,4 s de segmentation / recoloriage par visage
    sec_per_frame_gpu: 0.5
    tone_strength_l: 0.5        # part de la luminosité transférée (1 = tout, 0 = garde l'éclairage de la scène)
    tone_smoothing: 0.7         # EMA des stats de teint entre images (anti-scintillement)

segment:
  min_s: 5
  max_s: 60

upload:
  max_mb: 500
  video_ext: [.mp4, .mov, .webm, .mkv, .m4v]
  photo_ext: [.jpg, .jpeg, .png, .webp]
  photo_max_mb: 15

photos:
  max: 20

youtube:
  example_url: https://www.youtube.com/watch?v=x9yop0nYR9g   # proposé comme exemple dans l'UI
  max_duration_s: 900
  max_height: 720

render:
  max_height: 1080             # au-delà, la vidéo est réduite avant le swap (CPU)
  crf: 18
  preset: veryfast
  similarity_threshold: 0.28   # similarité cosinus minimale avec le visage cible
  smoothing: 0.6               # EMA des landmarks (0 = aucun lissage, 0.9 = très lissé)
  preview_every: 8             # frames entre deux aperçus live
  fps_cap: 30                  # option « Limiter à 30 i/s » : cadence max (atteinte en gardant une image sur N)
  duplicate_block_diff: 4.0    # écart max par bloc sous lequel une image est une copie de la précédente (0 = désactivé)
  default_sec_per_frame: 2.2   # estimation CPU avant le premier job mesuré (i7 4 cœurs ≈ 2,2 s)

proxy:
  max_height: 720
  filmstrip_count: 60
  filmstrip_height: 90

retention_hours: 48

server:
  host: 127.0.0.1
  port: 8000
